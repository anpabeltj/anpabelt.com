<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <!-- Animated telemetry backdrop — cinematic draw-in on page load (ANIMATION_52) -->
  <style>
    /* Keyframes for the cinematic opening sequence */
    @keyframes fadeInAtmosphere { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes drawHairline { 0% { stroke-dashoffset: 1600; opacity: 0; } 20% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes drawRidge { 0% { stroke-dashoffset: 2200; opacity: 0; } 15% { opacity: 0.65; } 100% { stroke-dashoffset: 0; opacity: 0.65; } }
    @keyframes drawContourSubtle { 0% { stroke-dashoffset: 2200; opacity: 0; } 30% { opacity: 0.35; } 100% { stroke-dashoffset: 0; opacity: 0.35; } }
    @keyframes expandRing { 0% { transform: scale(0.15); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes rotateReticle { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.25; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.08); } }
    @keyframes revealMetadata { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes sparkTwinkle { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }

    .anim-bg-glow { animation: fadeInAtmosphere 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-axis-h { stroke-dasharray: 1440; stroke-dashoffset: 1440; animation: drawHairline 2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
    .anim-axis-v { stroke-dasharray: 900; stroke-dashoffset: 900; animation: drawHairline 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards; }
    .anim-frame { opacity: 0; animation: fadeInAtmosphere 1.5s ease-out 0.8s forwards; }
    .anim-ridge-primary { stroke-dasharray: 2200; stroke-dashoffset: 2200; animation: drawRidge 2.6s cubic-bezier(0.19, 1, 0.22, 1) 0.6s forwards; }
    .anim-ridge-sub-1 { stroke-dasharray: 2200; stroke-dashoffset: 2200; animation: drawContourSubtle 2.8s cubic-bezier(0.19, 1, 0.22, 1) 0.8s forwards; }
    .anim-ridge-sub-2 { stroke-dasharray: 2200; stroke-dashoffset: 2200; animation: drawContourSubtle 3s cubic-bezier(0.19, 1, 0.22, 1) 1s forwards; }
    .anim-ridge-sub-3 { stroke-dasharray: 2200; stroke-dashoffset: 2200; animation: drawContourSubtle 3.2s cubic-bezier(0.19, 1, 0.22, 1) 1.2s forwards; }
    .anim-astrolabe-group { transform-box: fill-box; transform-origin: center; animation: expandRing 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both; }
    .anim-reticle-slow { transform-box: fill-box; transform-origin: center; animation: rotateReticle 120s linear infinite; }
    .anim-core-pulse { transform-box: fill-box; transform-origin: center; animation: pulseGlow 4s ease-in-out infinite; }
    .anim-emblem-badge { opacity: 0; transform-box: fill-box; transform-origin: center; animation: expandRing 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards; }
    .anim-spark-shimmer { transform-box: fill-box; transform-origin: center; animation: sparkTwinkle 3s ease-in-out infinite; }
    .anim-telemetry-left { opacity: 0; animation: revealMetadata 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards; }
    .anim-callout { opacity: 0; animation: revealMetadata 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.8s forwards; }
    .anim-metadata-bottom { opacity: 0; animation: revealMetadata 1.4s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards; }

    @media (prefers-reduced-motion: reduce) {
      .anim-axis-h, .anim-axis-v, .anim-ridge-primary, .anim-ridge-sub-1, .anim-ridge-sub-2, .anim-ridge-sub-3 { animation: none !important; stroke-dashoffset: 0 !important; }
      .anim-bg-glow, .anim-frame, .anim-astrolabe-group, .anim-emblem-badge, .anim-telemetry-left, .anim-callout, .anim-metadata-bottom { animation: none !important; opacity: 1 !important; }
      .anim-core-pulse, .anim-spark-shimmer, .anim-reticle-slow { animation: none !important; }
      .anim-ridge-primary { opacity: 0.65 !important; }
      .anim-ridge-sub-1, .anim-ridge-sub-2, .anim-ridge-sub-3 { opacity: 0.35 !important; }
    }
  </style>

  <!-- Obsidian Dark Background -->
  <rect width="1440" height="900" fill="#070709"/>

  <defs>
    <!-- Atmospheric deep cobalt glow (#05297A) -->
    <radialGradient id="focalGlowAnim" cx="64%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#05297A" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#05297A" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cornerGlowAnim" cx="16%" cy="28%" r="38%">
      <stop offset="0%" stop-color="#05297A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070709" stop-opacity="0"/>
    </radialGradient>
    <!-- Micro coordinate dot matrix pattern -->
    <pattern id="matrixDotsAnim" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.65" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <!-- Subtle linear fades for datum guides -->
    <linearGradient id="fadeDatumAnim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow & Pattern Layers with opening fade-in -->
  <g class="anim-bg-glow">
    <rect width="1440" height="900" fill="url(#focalGlowAnim)"/>
    <rect width="1440" height="900" fill="url(#cornerGlowAnim)"/>
    <rect width="1440" height="900" fill="url(#matrixDotsAnim)"/>
  </g>

  <!-- ================= MASTER TELEMETRY & SYSTEM DATUM FRAME ================= -->
  <g class="anim-frame" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.85">
    <!-- Blueprint Corner Crop Marks & Margin Frame -->
    <path d="M 64 88 L 64 64 L 88 64"/>
    <path d="M 1376 88 L 1376 64 L 1352 64"/>
    <path d="M 64 812 L 64 836 L 88 836"/>
    <path d="M 1376 812 L 1376 836 L 1352 836"/>
    <rect x="64" y="64" width="1312" height="772" stroke-opacity="0.06"/>
    <!-- Secondary Structural Hairlines & Dashes -->
    <line x1="0" y1="120" x2="1440" y2="120" stroke-dasharray="3 14" stroke-opacity="0.09"/>
    <line x1="0" y1="640" x2="1440" y2="640" stroke-dasharray="16 32 4 16" stroke-opacity="0.10"/>
    <line x1="0" y1="760" x2="1440" y2="760" stroke-dasharray="2 8" stroke-opacity="0.07"/>
    <line x1="280" y1="0" x2="280" y2="900" stroke-dasharray="4 16" stroke-opacity="0.08"/>
    <line x1="580" y1="0" x2="580" y2="900" stroke-dasharray="2 12" stroke-opacity="0.05"/>
    <line x1="1240" y1="0" x2="1240" y2="900" stroke-opacity="0.07"/>
  </g>

  <!-- Primary Drawing Axes -->
  <line class="anim-axis-h" x1="0" y1="370" x2="1440" y2="370" stroke="url(#fadeDatumAnim)" stroke-width="1"/>
  <line class="anim-axis-v" x1="930" y1="0" x2="930" y2="900" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>

  <!-- ================= TOPOGRAPHIC ELEVATION CONTOURS ================= -->
  <g fill="none" stroke="#ffffff">
    <!-- Primary Crisp Ridge Silhouette (draws in from bottom-right) -->
    <path class="anim-ridge-primary" d="M 1440 750 L 1370 705 L 1335 670 L 1300 625 L 1270 600 L 1240 550 L 1210 530 L 1180 480 L 1150 440 L 1120 420 L 1080 380 L 1050 350 L 1010 330 L 970 315 L 930 305 L 900 330 L 870 385 L 840 450 L 810 535 L 780 620 L 740 705 L 705 780 L 665 850 L 635 900" stroke-linejoin="round" stroke-width="1.3"/>

    <!-- Elevation Contour Tier 2 -->
    <path class="anim-ridge-sub-1" d="M 1440 780 L 1385 735 L 1345 700 L 1315 655 L 1285 630 L 1255 580 L 1225 560 L 1195 510 L 1165 470 L 1135 450 L 1095 410 L 1065 380 L 1025 360 L 985 345 L 945 335 L 910 365 L 880 425 L 850 495 L 820 580 L 790 665 L 755 750 L 720 825 L 690 900" stroke-dasharray="5 7" stroke-width="0.9"/>

    <!-- Elevation Contour Tier 3 -->
    <path class="anim-ridge-sub-2" d="M 1440 815 L 1395 770 L 1355 730 L 1325 685 L 1295 660 L 1265 615 L 1235 595 L 1205 545 L 1175 505 L 1145 485 L 1105 445 L 1075 415 L 1035 395 L 995 380 L 955 370 L 925 405 L 895 470 L 865 545 L 835 630 L 805 720 L 775 805 L 740 880 L 730 900" stroke-dasharray="2 6" stroke-width="0.8"/>

    <!-- Elevation Contour Tier 4 -->
    <path class="anim-ridge-sub-3" d="M 1440 850 L 1405 810 L 1365 765 L 1335 720 L 1305 695 L 1275 650 L 1245 625 L 1215 580 L 1185 540 L 1155 520 L 1115 480 L 1085 450 L 1045 430 L 1005 415 L 965 405 L 935 445 L 905 515 L 875 595 L 845 680 L 820 770 L 790 855 L 770 900" stroke-dasharray="1 5" stroke-width="0.75"/>

    <!-- Architectural Slope Graduations & Terrace Ticks -->
    <g class="anim-frame" stroke-opacity="0.32" stroke-width="0.8">
      <line x1="1240" y1="550" x2="1255" y2="540"/>
      <line x1="1180" y1="480" x2="1195" y2="470"/>
      <line x1="1120" y1="420" x2="1135" y2="410"/>
      <line x1="1050" y1="350" x2="1065" y2="340"/>
      <line x1="970" y1="315" x2="970" y2="300"/>
      <line x1="870" y1="385" x2="855" y2="395"/>
      <line x1="810" y1="535" x2="795" y2="545"/>
      <line x1="780" y1="620" x2="765" y2="630"/>
    </g>
  </g>

  <!-- ================= FOCAL ASTROLABE COMPASS & ORBITAL GEOMETRY (930, 370) ================= -->
  <g class="anim-astrolabe-group">
    <!-- Deep Cobalt Core Anchor with ambient gentle pulse -->
    <g class="anim-core-pulse">
      <circle cx="930" cy="370" r="24" fill="#05297A" fill-opacity="0.38" stroke="#05297A" stroke-width="1.2"/>
    </g>
    <circle cx="930" cy="370" r="6" fill="#05297A" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="930" cy="370" r="1.5" fill="#ffffff"/>

    <!-- Concentric Calibration & Orbital Rings -->
    <circle cx="930" cy="370" r="320" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.8" stroke-dasharray="4 16 1 16"/>
    <circle cx="930" cy="370" r="260" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.8"/>
    <circle cx="930" cy="370" r="200" stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.75" stroke-dasharray="2 6"/>
    <circle cx="930" cy="370" r="115" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.9"/>
    <circle cx="930" cy="370" r="68" stroke="#ffffff" stroke-opacity="0.32" stroke-width="0.8" stroke-dasharray="4 6"/>

    <!-- Upward Crescent Arc (Signature Precision Geometric Arc) -->
    <g transform="translate(930, 370)">
      <path d="M -160 0 A 160 160 0 0 1 0 -160" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1.3"/>
      <path d="M 0 -160 A 160 160 0 0 1 160 0" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="0.9" stroke-dasharray="6 8"/>
      <!-- Counter-Balance Orbital Arc -->
      <path d="M -90 0 A 90 90 0 0 0 0 90" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1"/>
      <path d="M 0 90 A 90 90 0 0 0 90 0" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.75" stroke-dasharray="3 5"/>
    </g>

    <!-- Rotating Precision Degree / Radial Ticks along the 260px ring -->
    <g class="anim-reticle-slow" stroke="#ffffff" stroke-opacity="0.32" stroke-width="0.8">
      <g transform="translate(930, 370)">
        <line x1="0" y1="-260" x2="0" y2="-248"/>
        <line x1="260" y1="0" x2="248" y2="0"/>
        <line x1="0" y1="260" x2="0" y2="248"/>
        <line x1="-260" y1="0" x2="-248" y2="0"/>
        <!-- 45-degree angles -->
        <line x1="183.8" y1="-183.8" x2="175.4" y2="-175.4"/>
        <line x1="-183.8" y1="-183.8" x2="-175.4" y2="-175.4"/>
        <line x1="183.8" y1="183.8" x2="175.4" y2="175.4"/>
        <line x1="-183.8" y1="183.8" x2="-175.4" y2="175.4"/>
        <!-- 30 and 60 degree micro ticks -->
        <line x1="225.2" y1="-130" x2="218.2" y2="-126" stroke-opacity="0.18"/>
        <line x1="130" y1="-225.2" x2="126" y2="-218.2" stroke-opacity="0.18"/>
        <line x1="-130" y1="-225.2" x2="-126" y2="-218.2" stroke-opacity="0.18"/>
        <line x1="-225.2" y1="-130" x2="-218.2" y2="-126" stroke-opacity="0.18"/>
      </g>
    </g>

    <!-- Satellite Intelligence Optical Spark Nodes -->
    <g transform="translate(740, 480)">
      <circle cx="0" cy="0" r="2" fill="#ffffff" stroke="#05297A" stroke-width="1"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.75"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.75"/>
      <text x="16" y="3" fill="#ffffff" fill-opacity="0.32" font-family="'Courier New', monospace" font-size="6.5" letter-spacing="1">STN // 01.A</text>
    </g>
  </g>

  <!-- ================= ANPABELT CELESTIAL ASTROLABE EMBLEM BADGE ================= -->
  <g transform="translate(1070, 230)">
    <g class="anim-emblem-badge">
      <!-- Outer Double Badge Rings -->
      <circle cx="0" cy="0" r="36" fill="#08080a" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="31" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.8" stroke-dasharray="2 4"/>
      <circle cx="0" cy="0" r="41" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.75" stroke-dasharray="1 5"/>
      <!-- 8-Point Optical Precision Spark Emblem with Twinkle -->
      <g class="anim-spark-shimmer">
        <path d="M 0 -16 Q 2 -4 14 0 Q 2 4 0 16 Q -2 4 -14 0 Q -2 -4 0 -16 Z" fill="#ffffff" fill-opacity="0.95"/>
        <path d="M -7 -7 Q 0 -1 7 7 M -7 7 Q 0 1 7 -7" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8"/>
        <circle cx="0" cy="0" r="3.5" fill="#05297A" stroke="#ffffff" stroke-width="0.8"/>
      </g>
    </g>
    <!-- System Telemetry Callout Flag -->
    <g class="anim-callout">
      <line x1="38" y1="-4" x2="72" y2="-4" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8"/>
      <circle cx="74" cy="-4" r="1.5" fill="#05297A" stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.6"/>
      <text x="80" y="-1" fill="#ffffff" fill-opacity="0.45" font-family="'Courier New', monospace" font-size="7" letter-spacing="1.5">EMBLEM.01 // ANPABELT</text>
    </g>
  </g>

  <!-- ================= SECONDARY ARCHITECTURAL & TYPOGRAPHIC NODES (LEFT SIDE) ================= -->
  <g class="anim-telemetry-left" transform="translate(180, 240)">
    <!-- Delicate Crosshair Accent -->
    <circle cx="0" cy="0" r="28" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8" stroke-dasharray="3 5"/>
    <circle cx="0" cy="0" r="3.5" fill="#05297A" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.8"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.85"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.85"/>
    <!-- Semicircular Over-Arc Motif -->
    <path d="M -34 0 A 34 34 0 0 1 34 0" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.1"/>
    <!-- ANPABELT Editorial System Notations -->
    <text x="0" y="-38" text-anchor="middle" fill="#ffffff" fill-opacity="0.25" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="2">SYS.HORIZON // REF.03</text>
    <text x="0" y="38" text-anchor="middle" fill="#ffffff" fill-opacity="0.45" font-family="'Bodoni Moda', Georgia, serif" font-size="12" letter-spacing="6">( a n p a b e l t )</text>
    <text x="0" y="54" text-anchor="middle" fill="#ffffff" fill-opacity="0.25" font-family="'Courier New', monospace" font-size="7" letter-spacing="2">35°40'34"N · 139°45'01"E</text>
    <!-- Faint diagonal projection ray to main axis -->
    <line x1="0" y1="0" x2="750" y2="130" stroke="#ffffff" stroke-opacity="0.06" stroke-width="0.75" stroke-dasharray="4 8"/>
  </g>

  <!-- Left Precision Telemetry Vertical Scale (Ruler Graduations) -->
  <g class="anim-telemetry-left" transform="translate(100, 360)">
    <line x1="0" y1="0" x2="0" y2="280" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
    <!-- Graduations -->
    <g stroke="#ffffff" stroke-opacity="0.38" stroke-width="0.8">
      <line x1="0" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="20" x2="4" y2="20"/>
      <line x1="0" y1="40" x2="6" y2="40"/>
      <line x1="0" y1="60" x2="4" y2="60"/>
      <line x1="0" y1="80" x2="8" y2="80"/>
      <line x1="0" y1="100" x2="4" y2="100"/>
      <line x1="0" y1="120" x2="6" y2="120"/>
      <line x1="0" y1="140" x2="4" y2="140"/>
      <line x1="0" y1="160" x2="8" y2="160"/>
      <line x1="0" y1="180" x2="4" y2="180"/>
      <line x1="0" y1="200" x2="6" y2="200"/>
      <line x1="0" y1="220" x2="4" y2="220"/>
      <line x1="0" y1="240" x2="8" y2="240"/>
      <line x1="0" y1="260" x2="4" y2="260"/>
      <line x1="0" y1="280" x2="8" y2="280"/>
    </g>
    <!-- Telemetry Labels -->
    <text transform="translate(-14, 210) rotate(-90)" fill="#ffffff" fill-opacity="0.3" font-family="'Courier New', monospace" font-size="7" letter-spacing="2">SCALE CALIBRATION · ANPABELT // 2025.01</text>
    <text transform="translate(-14, 70) rotate(-90)" fill="#ffffff" fill-opacity="0.2" font-family="'Courier New', monospace" font-size="6.5" letter-spacing="1.5">OPTICAL DATUM // 1440×900</text>
  </g>

  <!-- ================= BOTTOM HORIZON CALIBRATION & METADATA BAR ================= -->
  <g class="anim-metadata-bottom" transform="translate(100, 810)">
    <!-- Segmented Horizon Bar -->
    <line x1="0" y1="0" x2="480" y2="0" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8" stroke-dasharray="4 8 1 4 16 8"/>
    <!-- Node markers -->
    <circle cx="0" cy="0" r="2" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="160" cy="0" r="2" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="320" cy="0" r="2.5" fill="#05297A" stroke="#ffffff" stroke-opacity="0.8" stroke-width="0.8"/>
    <circle cx="480" cy="0" r="2" fill="#ffffff" fill-opacity="0.6"/>
    <!-- ANPABELT System Identity Metadata -->
    <text x="0" y="16" fill="#ffffff" fill-opacity="0.35" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="1.5">SYS // ANPABELT LINEAR HORIZON · TOPOGRAPHIC SYSTEM SCHEMATICS</text>
    <text x="0" y="28" fill="#ffffff" fill-opacity="0.2" font-family="'Courier New', monospace" font-size="6.5" letter-spacing="1">SPECS: 4-TIER TOPOGRAPHY · ASYMMETRIC CROSSHAIR · COBALT CORE #05297A</text>
  </g>

  <!-- Top Right Mode Annotation -->
  <g class="anim-frame" transform="translate(1260, 84)">
    <text x="0" y="0" fill="#ffffff" fill-opacity="0.3" font-family="'Courier New', monospace" font-size="7.5" letter-spacing="2">MOD // (ANPABELT)</text>
    <line x1="78" y1="-3" x2="110" y2="-3" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8"/>
    <circle cx="114" cy="-3" r="1.5" fill="#05297A" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.5"/>
  </g>

  <!-- Center-Top Crop Registration Reference Tick -->
  <g class="anim-frame" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.85">
    <line x1="720" y1="48" x2="720" y2="68" stroke-dasharray="2 4"/>
    <circle cx="720" cy="72" r="1" fill="#ffffff"/>
  </g>
</svg>
